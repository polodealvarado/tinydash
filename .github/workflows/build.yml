name: Build

on:
  push:
    branches: [main]
    paths: ["macos-app/**", "dashboard/**", "scripts/**", ".github/workflows/**"]
  pull_request:
    paths: ["macos-app/**", "dashboard/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  universal-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Package and validate both architectures
        run: ./scripts/package.sh
