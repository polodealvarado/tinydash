name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and verify universal package
        env:
          TINYDASH_RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package.sh
      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG. Use a new version; published archives are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Tinydash $RELEASE_TAG" --notes-file .github/release-notes.md
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256
          gh release edit "$RELEASE_TAG" --draft=false

  update-cask:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/update-cask.yml
